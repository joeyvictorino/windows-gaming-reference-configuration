name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell-7:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Pin known-good WinGet for DSC v3 validation
        shell: pwsh
        run: |
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -Version "1.28.240" -Force
          $version = winget --version
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet pin failed."
          }
          if ($version -ne 'v1.28.240') {
            throw "Expected WinGet v1.28.240, got $version"
          }
          winget configure --enable
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet Configuration could not be enabled."
          }
          winget install Microsoft.DSC --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft.DSC prerequisite installation failed."
          }
          Write-Host "Validating with WinGet $version"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse `
            -Settings .\PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize
          $errors = @($issues | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer found errors." }

      - name: Pester
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed."
          }

      - name: Validate WinGet gaming configuration
        shell: pwsh
        run: |
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            throw "winget.exe is unavailable on the test runner."
          }

          winget configure validate -f .\.config\configuration.winget
          if ($LASTEXITCODE -ne 0) { throw "Gaming WinGet Configuration validation failed." }

          winget configure validate -f .\.config\office.winget
          if ($LASTEXITCODE -ne 0) { throw "Office WinGet Configuration validation failed." }

  windows-powershell-parser:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse scripts with inbox Windows PowerShell
        shell: powershell
        run: |
          $files = Get-ChildItem . -Recurse -File -Include *.ps1,*.psm1,*.psd1
          $failed = @()

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors) {
              $failed += $file.FullName
              $errors | Format-List
            }
          }

          if ($failed.Count -gt 0) {
            throw "Windows PowerShell parser failed: $($failed -join ', ')"
          }
