name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install validation modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Prepare current WinGet for DSC v3 resolution
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -Force -Latest
          $version = winget --version
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet update failed."
          }
          winget configure --enable
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet Configuration could not be enabled."
          }
          winget install Microsoft.DSC --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft.DSC prerequisite installation failed."
          }
          Write-Host "Resolving configurations with WinGet $version"

      - name: PSScriptAnalyzer gate
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse `
            -Settings .\PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize
          $errors = @($issues | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer found errors."
          }

      - name: Pester gate
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed."
          }

      - name: Windows PowerShell parser gate
        shell: powershell
        run: |
          $files = Get-ChildItem . -Recurse -File -Include *.ps1,*.psm1,*.psd1
          $failed = @()

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null

            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors) {
              $failed += $file.FullName
              $errors | Format-List
            }
          }

          if ($failed.Count -gt 0) {
            throw "Windows PowerShell parser failed."
          }

      - name: Resolve WinGet configurations
        shell: pwsh
        run: |
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            throw "winget.exe is unavailable on the release runner."
          }

          winget configure show -f .\.config\configuration.winget --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Gaming WinGet Configuration resolution failed."
          }

          winget configure show -f .\.config\office.winget --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Office WinGet Configuration resolution failed."
          }

      - name: Build release ZIP and SHA-256
        shell: pwsh
        run: |
          $name = "windows-gaming-reference-configuration-$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Path dist | Out-Null

          $items = Get-ChildItem -Force |
            Where-Object { $_.Name -notin @('.git','dist') }

          Compress-Archive -Path $items.FullName `
            -DestinationPath "dist\$name.zip" `
            -CompressionLevel Optimal

          $hash = Get-FileHash "dist\$name.zip" -Algorithm SHA256
          "$($hash.Hash)  $name.zip" |
            Set-Content "dist\$name.zip.sha256" -Encoding ascii

      - name: Generate GitHub build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*.zip'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\windows-gaming-reference-configuration-$env:GITHUB_REF_NAME.zip" `
            "dist\windows-gaming-reference-configuration-$env:GITHUB_REF_NAME.zip.sha256" `
            --generate-notes `
            --title "$env:GITHUB_REF_NAME"
