name: Patch WinGet Preflight

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime WinGet preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/WGRC.Core.psm1'
          $content = Get-Content $path -Raw
          $content = $content.Replace(
            '& winget.exe configure validate -f $Path | Out-Null',
            '& winget.exe configure show -f $Path --disable-interactivity | Out-Null'
          )
          $content = $content.Replace(
            'Optional WinGet configuration failed validation: $Path',
            'Optional WinGet configuration failed resolution: $Path'
          )
          $content = $content.Replace(
            'WinGet configuration failed validation: $Path',
            'WinGet configuration failed resolution: $Path'
          )
          Set-Content -Path $path -Value $content -Encoding utf8

      - name: Commit runtime fix and remove trigger
        shell: pwsh
        run: |
          git config user.name 'Joey Victorino'
          git config user.email '6811753+joeyvictorino@users.noreply.github.com'
          git add src/WGRC.Core.psm1
          git rm .github/workflows/patch-winget-preflight.yml
          git commit -m 'fix: use resource resolution for DSC v3 preflight'
          git push origin HEAD:main
